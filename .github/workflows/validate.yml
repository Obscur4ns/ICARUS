name: Validate

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

env:
  HEMTT_VERSION: "1.21.0"

jobs:
  arma:
    name: ArmA / HEMTT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup HEMTT
        shell: bash
        run: |
          set -euo pipefail

          hemtt_dir="$RUNNER_TEMP/hemtt"
          hemtt_archive="$RUNNER_TEMP/hemtt-linux-x64.zip"

          curl \
            --fail \
            --location \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://github.com/BrettMayson/HEMTT/releases/download/v${HEMTT_VERSION}/linux-x64.zip" \
            --output "$hemtt_archive"

          mkdir -p "$hemtt_dir"
          unzip -q "$hemtt_archive" -d "$hemtt_dir"
          chmod +x "$hemtt_dir/hemtt"

          actual_version="$("$hemtt_dir/hemtt" --version 2>&1 || true)"
          expected_version="hemtt ${HEMTT_VERSION}"

          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Expected $expected_version but found $actual_version."
            exit 1
          fi

          echo "$hemtt_dir" >> "$GITHUB_PATH"
          echo "Using $actual_version"

      - name: Lint
        run: hemtt check --pedantic --error-on-all

      - name: Build
        run: hemtt build --no-bin

  native:
    name: Native / Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch TeamSpeak 3 Plugin SDK
        shell: pwsh
        run: .\tools\fetch-ts3-sdk.ps1

      - name: Configure
        run: cmake --preset windows-x64-ts3

      - name: Build
        run: cmake --build --preset windows-x64-ts3-release

      - name: Test
        run: ctest --preset windows-x64-ts3-release